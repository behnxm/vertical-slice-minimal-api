name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Verify Solution
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install EF Core CLI Tool
        run: dotnet tool install --global dotnet-ef

      - name: Restore Dependencies
        run: dotnet restore

      - name: Verify Code Formatting
        run: dotnet format --verify-no-changes

      - name: Verify Pending Model Changes
        run: dotnet ef migrations has-pending-model-changes --project src/TaskTracker.Api

      - name: Build Solution
        run: dotnet build -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/TaskTracker.UnitTests -c Release --no-build --verbosity normal

      - name: Run Architecture Tests
        run: dotnet test tests/TaskTracker.ArchitectureTests -c Release --no-build --verbosity normal

      - name: Run Integration Tests (Testcontainers)
        run: dotnet test tests/TaskTracker.IntegrationTests -c Release --no-build --verbosity normal
